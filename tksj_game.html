
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>星际守护者 - HTML5 太空射击游戏</title>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap');

        body {
            font-family: 'Orbitron', sans-serif;
            background-color: #0f172a;
            overflow: hidden;
            touch-action: none; /* 防止移动端滚动 */
        }

        #game-container {
            position: relative;
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle at center, #1e293b 0%, #020617 100%);
        }

        canvas {
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.5);
            border-radius: 8px;
            background-color: #000;
            max-width: 100%;
            max-height: 100%;
        }

        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
        }

        .hud-top {
            display: flex;
            justify-content: space-between;
            color: #38bdf8;
            text-shadow: 0 0 5px #38bdf8;
            font-size: 1.2rem;
            z-index: 10;
        }

        .modal {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 20;
            pointer-events: auto;
            backdrop-filter: blur(5px);
            transition: opacity 0.3s ease;
        }

        .hidden {
            opacity: 0;
            pointer-events: none;
        }

        .btn-neon {
            background: transparent;
            border: 2px solid #38bdf8;
            color: #38bdf8;
            padding: 12px 30px;
            font-size: 1.2rem;
            font-family: 'Orbitron', sans-serif;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-top: 20px;
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.2);
        }

        .btn-neon:hover {
            background: #38bdf8;
            color: #0f172a;
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.6);
        }

        .title-glitch {
            font-size: 3rem;
            font-weight: bold;
            color: #fff;
            text-shadow: 2px 2px #ec4899, -2px -2px #38bdf8;
            margin-bottom: 10px;
            animation: glitch 1s infinite alternate;
        }

        @keyframes glitch {
            0% { text-shadow: 2px 2px #ec4899, -2px -2px #38bdf8; }
            25% { text-shadow: -2px 2px #ec4899, 2px -2px #38bdf8; }
            50% { text-shadow: 2px -2px #ec4899, -2px 2px #38bdf8; }
            75% { text-shadow: -2px -2px #ec4899, 2px 2px #38bdf8; }
            100% { text-shadow: 2px 2px #ec4899, -2px -2px #38bdf8; }
        }

        .controls-hint {
            color: #94a3b8;
            font-size: 0.9rem;
            margin-top: 20px;
            text-align: center;
        }

        /* 移动端控制按钮 */
        .mobile-controls {
            display: none;
            position: absolute;
            bottom: 20px;
            width: 100%;
            justify-content: space-between;
            padding: 0 40px;
            pointer-events: auto;
            z-index: 15;
        }

        @media (max-width: 768px) {
            .mobile-controls {
                display: flex;
            }
            .controls-hint {
                display: none;
            }
        }

        .control-btn {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: rgba(56, 189, 248, 0.2);
            border: 2px solid #38bdf8;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.5rem;
            user-select: none;
        }
        
        .control-btn:active {
            background: rgba(56, 189, 248, 0.5);
        }

        .fire-btn {
            background: rgba(236, 72, 153, 0.2);
            border-color: #ec4899;
            width: 80px;
            height: 80px;
        }
        
        .fire-btn:active {
            background: rgba(236, 72, 153, 0.5);
        }

    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas"></canvas>

    <!-- HUD 界面 -->
    <div class="ui-layer">
        <div class="hud-top">
            <div id="scoreDisplay"><i class="fas fa-star"></i> 分数: 0</div>
            <div id="healthDisplay"><i class="fas fa-heart"></i> 生命: 100%</div>
        </div>
        
        <!-- 移动端控制 -->
        <div class="mobile-controls">
            <div class="flex gap-4">
                <div class="control-btn" id="btnLeft"><i class="fas fa-arrow-left"></i></div>
                <div class="control-btn" id="btnRight"><i class="fas fa-arrow-right"></i></div>
            </div>
            <div class="control-btn fire-btn" id="btnFire"><i class="fas fa-crosshairs"></i></div>
        </div>
    </div>

    <!-- 开始菜单 -->
    <div id="startScreen" class="modal">
        <h1 class="title-glitch">星际守护者</h1>
        <p class="text-cyan-300 mb-4">保卫地球，击退外星入侵者！</p>
        <button class="btn-neon" onclick="game.start()">开始任务</button>
        <div class="controls-hint">
            <p><i class="fas fa-keyboard"></i> 使用 ← → 移动，空格键射击</p>
            <p>或者使用屏幕下方的触摸按钮</p>
        </div>
    </div>

    <!-- 游戏结束菜单 -->
    <div id="gameOverScreen" class="modal hidden">
        <h1 class="text-4xl font-bold text-red-500 mb-2">任务失败</h1>
        <p class="text-white text-xl mb-4">最终得分: <span id="finalScore" class="text-cyan-400">0</span></p>
        <button class="btn-neon" onclick="game.restart()">重新挑战</button>
    </div>
    
    <!-- 暂停菜单 -->
    <div id="pauseScreen" class="modal hidden">
        <h1 class="text-3xl font-bold text-yellow-400 mb-4">已暂停</h1>
        <button class="btn-neon" onclick="game.resume()">继续游戏</button>
    </div>
</div>

<script>
/**
 * 游戏核心逻辑
 */
class SpaceShooterGame {
    constructor() {
        this.canvas = document.getElementById('gameCanvas');
        this.ctx = this.canvas.getContext('2d');
        this.width = 800;
        this.height = 600;
        
        // 设置画布大小
        this.resize();
        window.addEventListener('resize', () => this.resize());

        // 游戏状态
        this.state = 'MENU'; // MENU, PLAYING, PAUSED, GAMEOVER
        this.score = 0;
        this.health = 100;
        this.level = 1;
        this.frames = 0;

        // 实体管理
        this.player = null;
        this.bullets = [];
        this.enemies = [];
        this.particles = [];
        this.stars = [];

        // 输入控制
        this.keys = {
            ArrowLeft: false,
            ArrowRight: false,
            Space: false
        };

        this.initInput();
        this.initStars();
        
        // 启动渲染循环
        this.loop = this.loop.bind(this);
        requestAnimationFrame(this.loop);
    }

    resize() {
        // 保持纵横比或适应屏幕
        const aspectRatio = 4/3;
        let w = window.innerWidth;
        let h = window.innerHeight;
        
        if (w / h > aspectRatio) {
            w = h * aspectRatio;
        } else {
            h = w / aspectRatio;
        }
        
        this.canvas.width = this.width;
        this.canvas.height = this.height;
        
        // CSS 缩放以适应屏幕
        this.canvas.style.width = `${w}px`;
        this.canvas.style.height = `${h}px`;
    }

    initInput() {
        // 键盘事件
        window.addEventListener('keydown', (e) => {
            if (e.code === 'ArrowLeft') this.keys.ArrowLeft = true;
            if (e.code === 'ArrowRight') this.keys.ArrowRight = true;
            if (e.code === 'Space') {
                if (!this.keys.Space && this.state === 'PLAYING') {
                    this.player.shoot();
                }
                this.keys.Space = true;
            }
            if (e.code === 'Escape' && this.state === 'PLAYING') {
                this.pause();
            }
        });

        window.addEventListener('keyup', (e) => {
            if (e.code === 'ArrowLeft') this.keys.ArrowLeft = false;
            if (e.code === 'ArrowRight') this.keys.ArrowRight = false;
            if (e.code === 'Space') this.keys.Space = false;
        });

        // 触摸事件
        const btnLeft = document.getElementById('btnLeft');
        const btnRight = document.getElementById('btnRight');
        const btnFire = document.getElementById('btnFire');

        const addTouch = (elem, key) => {
            elem.addEventListener('touchstart', (e) => { e.preventDefault(); this.keys[key] = true; if(key==='Space' && this.state==='PLAYING') this.player.shoot(); });
            elem.addEventListener('touchend', (e) => { e.preventDefault(); this.keys[key] = false; });
            elem.addEventListener('mousedown', (e) => { this.keys[key] = true; if(key==='Space' && this.state==='PLAYING') this.player.shoot(); });
            elem.addEventListener('mouseup', (e) => { this.keys[key] = false; });
        };

        addTouch(btnLeft, 'ArrowLeft');
        addTouch(btnRight, 'ArrowRight');
        addTouch(btnFire, 'Space');
    }

    initStars() {
        for (let i = 0; i < 100; i++) {
            this.stars.push({
                x: Math.random() * this.width,
                y: Math.random() * this.height,
                size: Math.random() * 2,
                speed: Math.random() * 0.5 + 0.1
            });
        }
    }

    start() {
        this.state = 'PLAYING';
        this.score = 0;
        this.health = 100;
        this.level = 1;
        this.bullets = [];
        this.enemies = [];
        this.particles = [];
        this.player = new Player(this.width / 2, this.height - 50);
        
        document.getElementById('startScreen').classList.add('hidden');
        document.getElementById('gameOverScreen').classList.add('hidden');
        this.updateUI();
    }

    restart() {
        this.start();
    }

    pause() {
        this.state = 'PAUSED';
        document.getElementById('pauseScreen').classList.remove('hidden');
    }

    resume() {
        this.state = 'PLAYING';
        document.getElementById('pauseScreen').classList.add('hidden');
    }

    gameOver() {
        this.state = 'GAMEOVER';
        document.getElementById('finalScore').innerText = this.score;
        document.getElementById('gameOverScreen').classList.remove('hidden');
    }

    updateUI() {
        document.getElementById('scoreDisplay').innerHTML = `<i class="fas fa-star"></i> 分数: ${this.score}`;
        document.getElementById('healthDisplay').innerHTML = `<i class="fas fa-heart"></i> 生命: ${this.health}%`;
        
        // 动态颜色
        const healthEl = document.getElementById('healthDisplay');
        if (this.health > 50) healthEl.className = 'text-green-400 drop-shadow-md';
        else if (this.health > 20) healthEl.className = 'text-yellow-400 drop-shadow-md';
        else healthEl.className = 'text-red-500 drop-shadow-md animate-pulse';
    }

    spawnEnemy() {
        // 难度随分数增加
        const spawnRate = Math.max(30, 100 - Math.floor(this.score / 50));
        if (this.frames % spawnRate === 0) {
            const x = Math.random() * (this.width - 40) + 20;
            const type = Math.random() > 0.8 ? 'fast' : 'normal';
            this.enemies.push(new Enemy(x, -30, type));
        }
    }

    createExplosion(x, y, color) {
        for (let i = 0; i < 15; i++) {
            this.particles.push(new Particle(x, y, color));
        }
    }

    loop() {
        // 清除画布
        this.ctx.fillStyle = '#000';
        this.ctx.fillRect(0, 0, this.width, this.height);

        // 绘制背景星空
        this.ctx.fillStyle = '#fff';
        this.stars.forEach(star => {
            this.ctx.globalAlpha = Math.random() * 0.5 + 0.3;
            this.ctx.beginPath();
            this.ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
            this.ctx.fill();
            
            if (this.state === 'PLAYING') {
                star.y += star.speed;
                if (star.y > this.height) star.y = 0;
            }
        });
        this.ctx.globalAlpha = 1.0;

        if (this.state === 'PLAYING') {
            this.frames++;

            // 更新玩家
            if (this.keys.ArrowLeft) this.player.move(-1);
            if (this.keys.ArrowRight) this.player.move(1);
            this.player.update();
            this.player.draw(this.ctx);

            // 生成敌人
            this.spawnEnemy();

            // 更新子弹
            this.bullets.forEach((bullet, index) => {
                bullet.update();
                bullet.draw(this.ctx);
                if (bullet.markedForDeletion) this.bullets.splice(index, 1);
            });

            // 更新敌人
            this.enemies.forEach((enemy, eIndex) => {
                enemy.update();
                enemy.draw(this.ctx);

                // 碰撞检测：子弹击中敌人
                this.bullets.forEach((bullet, bIndex) => {
                    if (!bullet.markedForDeletion && !enemy.markedForDeletion && 
                        this.checkCollision(bullet, enemy)) {
                        
                        enemy.hp--;
                        bullet.markedForDeletion = true;
                        
                        if (enemy.hp <= 0) {
                            enemy.markedForDeletion = true;
                            this.createExplosion(enemy.x, enemy.y, enemy.color);
                            this.score += enemy.scoreValue;
                            this.updateUI();
                        } else {
                            // 击中特效
                            this.createExplosion(bullet.x, bullet.y, '#fff');
                        }
                    }
                });

                // 碰撞检测：敌人撞击玩家
                if (!enemy.markedForDeletion && this.checkCollision(enemy, this.player)) {
                    enemy.markedForDeletion = true;
                    this.createExplosion(enemy.x, enemy.y, '#ff0000');
                    this.health -= 20;
                    this.updateUI();
                    if (this.health <= 0) {
                        this.createExplosion(this.player.x, this.player.y, '#38bdf8');
                        this.gameOver();
                    }
                }

                if (enemy.markedForDeletion) this.enemies.splice(eIndex, 1);
            });

            // 更新粒子
            this.particles.forEach((particle, index) => {
                particle.update();
                particle.draw(this.ctx);
                if (particle.markedForDeletion) this.particles.splice(index, 1);
            });
        }

        requestAnimationFrame(this.loop);
    }

    checkCollision(rect1, rect2) {
        return (
            rect1.x < rect2.x + rect2.width &&
            rect1.x + rect1.width > rect2.x &&
            rect1.y < rect2.y + rect2.height &&
            rect1.y + rect1.height > rect2.y
        );
    }
}

/**
 * 玩家类
 */
class Player {
    constructor(x, y) {
        this.x = x;
        this.y = y;
        this.width = 40;
        this.height = 40;
        this.speed = 5;
        this.color = '#38bdf8';
    }

    move(direction) {
        this.x += direction * this.speed;
        // 边界限制
        if (this.x < 0) this.x = 0;
        if (this.x > game.width - this.width) this.x = game.width - this.width;
    }

    shoot() {
        game.bullets.push(new Bullet(this.x + this.width / 2 - 2, this.y));
    }

    update() {
        // 可以在这里添加冷却逻辑等
    }

    draw(ctx) {
        ctx.fillStyle = this.color;
        // 绘制飞船形状 (三角形)
        ctx.beginPath();
        ctx.moveTo(this.x + this.width / 2, this.y);
        ctx.lineTo(this.x + this.width, this.y + this.height);
        ctx.lineTo(this.x + this.width / 2, this.y + this.height - 10);
        ctx.lineTo(this.x, this.y + this.height);
        ctx.closePath();
        ctx.fill();
        
        // 引擎火焰
        ctx.fillStyle = '#f59e0b';
        ctx.beginPath();
        ctx.moveTo(this.x + this.width / 2 - 5, this.y + this.height - 5);
        ctx.lineTo(this.x + this.width / 2 + 5, this.y + this.height - 5);
        ctx.lineTo(this.x + this.width / 2, this.y + this.height + (Math.random() * 10 + 5));
        ctx.fill();
    }
}

/**
 * 子弹类
 */
class Bullet {
    constructor(x, y) {
        this.x = x;
        this.y = y;
        this.width = 4;
        this.height = 10;
        this.speed = 10;
        this.markedForDeletion = false;
    }

    update() {
        this.y -= this.speed;
        if (this.y < 0) this.markedForDeletion = true;
    }

    draw(ctx) {
        ctx.fillStyle = '#facc15';
        ctx.fillRect(this.x, this.y, this.width, this.height);
    }
}

/**
 * 敌人类
 */
class Enemy {
    constructor(x, y, type) {
        this.x = x;
        this.y = y;
        this.width = 30;
        this.height = 30;
        this.type = type;
        this.markedForDeletion = false;
        
        if (type === 'fast') {
            this.speed = 4;
            this.color = '#ec4899'; // Pink
            this.hp = 1;
            this.scoreValue = 20;
        } else {
            this.speed = 2;
            this.color = '#ef4444'; // Red
            this.hp = 2;
            this.scoreValue = 10;
        }
    }

    update() {
        this.y += this.speed;
        if (this.y > game.height) this.markedForDeletion = true;
    }

    draw(ctx) {
        ctx.fillStyle = this.color;
        // 绘制敌人形状 (倒三角或方块)
        if (this.type === 'fast') {
            ctx.beginPath();
            ctx.moveTo(this.x, this.y);
            ctx.lineTo(this.x + this.width, this.y);
            ctx.lineTo(this.x + this.width / 2, this.y + this.height);
            ctx.closePath();
            ctx.fill();
        } else {
            ctx.fillRect(this.x, this.y, this.width, this.height);
            // 装饰
            ctx.fillStyle = '#000';
            ctx.fillRect(this.x + 5, this.y + 5, this.width - 10, this.height - 10);
        }
    }
}

/**
 * 粒子效果类
 */
class Particle {
    constructor(x, y, color) {
        this.x = x;
        this.y = y;
        this.size = Math.random() * 3 + 1;
        this.speedX = Math.random() * 4 - 2;
        this.speedY = Math.random() * 4 - 2;
        this.color = color;
        this.life = 1.0;
        this.markedForDeletion = false;
    }

    update() {
        this.x += this.speedX;
        this.y += this.speedY;
        this.life -= 0.05;
        if (this.life <= 0) this.markedForDeletion = true;
    }

    draw(ctx) {
        ctx.globalAlpha = this.life;
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1.0;
    }
}

// 初始化游戏
const game = new SpaceShooterGame();

</script>
</body>
</html>
