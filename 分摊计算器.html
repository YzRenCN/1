<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>账单分摊计算器</title>
<style>
    body {
        font-family: Arial, sans-serif;
        max-width: 400px;
        margin: 50px auto;
        padding: 20px;
        background: #f5f5f5;
    }

    .card {
        background: white;
        padding: 20px;
        border-radius: 12px;
        box-shadow: 0 2px 10px rgba(0,0,0,.1);
    }

    h2 {
        text-align: center;
    }

    input, button {
        width: 100%;
        padding: 10px;
        margin-top: 10px;
        box-sizing: border-box;
    }

    button {
        background: #4CAF50;
        color: white;
        border: none;
        cursor: pointer;
        border-radius: 6px;
    }

    button:hover {
        background: #45a049;
    }

    .result {
        margin-top: 15px;
        font-size: 18px;
        text-align: center;
        font-weight: bold;
        color: #333;
    }
</style>
</head>
<body>

<div class="card">
    <h2>💰 账单分摊计算器</h2>

    <input type="number" id="total" placeholder="总金额（元）">
    <input type="number" id="people" placeholder="人数">

    <button onclick="calculate()">计算</button>

    <div class="result" id="result"></div>
</div>

<script>
function calculate() {
    const total = parseFloat(document.getElementById("total").value);
    const people = parseInt(document.getElementById("people").value);

    if (!total || !people || people <= 0) {
        document.getElementById("result").innerText =
            "请输入正确的金额和人数";
        return;
    }

    const perPerson = (total / people).toFixed(2);

    document.getElementById("result").innerHTML =
        `每人应付：<span style="color:#4CAF50">${perPerson} 元</span>`;
}
</script>

</body>
</html>
