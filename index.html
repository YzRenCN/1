    <style>
        /* ============================================
           基础重置 & 全局优化 (保留原有视觉)
           ============================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans SC", sans-serif;
            background: #f9f8f6;
            color: #1e1e1c;
            padding: 20px 24px;
            line-height: 1.6;
            max-width: 1500px;
            margin: 0 auto;
        }

        /* 统一链接风格，保留原有色块样式 */
        a {
            text-decoration: none;
            transition: all 0.2s ease;
        }

        /* 保留原界面中的所有背景色块、圆角、阴影等，仅微调交互 */
        p {
            margin-bottom: 12px;
        }

        hr {
            border: 0;
            border-top: 2px solid #e2ddd6;
            margin: 24px 0;
        }

        .text-primary {
            color: #cc785c;
        }

        .underline {
            text-decoration: none;
        }

        .font-bold {
            font-weight: 600;
        }

        /* 百度搜索框模块 – 保留原有样式 + 搜索按钮缩放0.6 */
        .max-w-lg {
            max-width: 32rem;
            margin-left: auto;
            margin-right: auto;
        }

        .mx-auto {
            margin-left: auto;
            margin-right: auto;
        }

        .relative {
            position: relative;
        }

        .group {
            transition: all 0.2s;
        }

        .flex {
            display: flex;
        }

        .items-center {
            align-items: center;
        }

        .w-full {
            width: 100%;
        }

        .pl-10 {
            padding-left: 2.5rem;
        }

        .pr-4 {
            padding-right: 1rem;
        }

        .py-3 {
            padding-top: 0.75rem;
            padding-bottom: 0.75rem;
        }

        .border-2 {
            border-width: 2px;
        }

        .border-gray-200 {
            border-color: #e5e7eb;
        }

        .rounded-l-full {
            border-top-left-radius: 9999px;
            border-bottom-left-radius: 9999px;
        }

        .bg-gray-50 {
            background-color: #f9fafb;
        }

        .placeholder-gray-400::placeholder {
            color: #9ca3af;
        }

        .focus\:outline-none:focus {
            outline: none;
        }

        .focus\:bg-white:focus {
            background-color: #fff;
        }

        .focus\:border-blue-500:focus {
            border-color: #3b82f6;
        }

        .focus\:ring-2:focus {
            --tw-ring-offset-shadow: var(--tw-ring-inset) 0 0 0 var(--tw-ring-offset-width) var(--tw-ring-offset-color);
            --tw-ring-shadow: var(--tw-ring-inset) 0 0 0 calc(2px + var(--tw-ring-offset-width)) var(--tw-ring-color);
            box-shadow: var(--tw-ring-offset-shadow), var(--tw-ring-shadow), var(--tw-shadow, 0 0 #0000);
        }

        .focus\:ring-blue-200:focus {
            --tw-ring-color: #bfdbfe;
        }

        .transition-all {
            transition-property: all;
            transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
            transition-duration: 300ms;
        }

        .duration-300 {
            transition-duration: 300ms;
        }

        .sm\:text-sm {
            font-size: 0.875rem;
            line-height: 1.25rem;
        }

        /* 保留原有块级元素的背景色、圆角、阴影等 */
        h2.text-xl {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 16px;
            color: #1e1e1c;
        }

        img {
            max-width: 100%;
            height: auto;
            vertical-align: middle;
        }

        /* 导航链接块（原有灰底圆角按钮）保留 */
        .nav-btn-group {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 6px;
            align-items: center;
        }
        .nav-btn-group a {
            display: inline-block;
            padding: 4px 16px;
            border-radius: 50px;
            background: #bbbbbb;
            color: #777;
            font-size: 16px;
            font-family: "Noto Sans SC", sans-serif;
            transition: all 0.2s;
            text-decoration: none;
        }
        .nav-btn-group a:hover {
            background: #aaa;
            color: #333;
            transform: translateY(-1px);
        }

        /* 保留其他原有色块链接 (棕色/蓝色) */
        a[style*="background: none 0% 0% / auto repeat scroll padding-box border-box rgb(121, 85, 72)"] {
            display: inline-block;
            padding: 2px 14px;
            border-radius: 12px;
            background: #795548 !important;
            color: #fff !important;
            font-size: 24px;
            font-family: "Noto Sans SC", sans-serif;
            transition: all 0.2s;
        }
        a[style*="background: none 0% 0% / auto repeat scroll padding-box border-box rgb(121, 85, 72)"]:hover {
            background: #5d4037 !important;
            transform: scale(1.02);
        }

        a[style*="background: none 0% 0% / auto repeat scroll padding-box border-box rgb(79, 195, 247)"] {
            display: inline-block;
            padding: 2px 14px;
            border-radius: 12px;
            background: #4fc3f7 !important;
            color: #fff !important;
            font-size: 16px;
            font-family: "Noto Sans SC", sans-serif;
            transition: all 0.2s;
        }
        a[style*="background: none 0% 0% / auto repeat scroll padding-box border-box rgb(79, 195, 247)"]:hover {
            background: #29b6f6 !important;
            transform: scale(1.02);
        }

        /* 其他微调：防止文字溢出，改善可读性 */
        .inline-block {
            display: inline-block;
        }

        .max-w-full {
            max-width: 100%;
        }

        .cursor-pointer {
            cursor: pointer;
        }

        .align-bottom {
            vertical-align: bottom;
        }

        /* 保留所有原有内联样式，不做覆盖，只做增强 */
        /* 针对视觉编辑器注入的样式，我们保留但不干扰 */
        [data-hve-hovered] {
            outline: 2px dashed #cc785c !important;
            outline-offset: 2px !important;
            cursor: pointer !important;
        }
        
        /* 搜索框左侧欢迎文字 */
        .welcome-left {
            font-size: 24px;
            font-weight: 400;
            color: #1e1e1c;
            white-space: nowrap;
            margin-right: 20px;
            letter-spacing: 0.5px;
            font-family: "Inter", "Noto Sans SC", -apple-system, BlinkMacSystemFont, sans-serif;
        }

        /* 优化移动端显示 */
        @media (max-width: 640px) {
            body {
                padding: 12px 16px;
            }
            a[style*="background: none 0% 0% / auto repeat scroll padding-box border-box rgb(121, 85, 72)"] {
                font-size: 18px !important;
                padding: 2px 10px;
            }
            .max-w-lg {
                max-width: 100%;
            }
            .nav-btn-group a {
                font-size: 14px;
                padding: 3px 12px;
            }
            .search-btn {
                transform: scale(0.6);
                padding: 0.5rem 1rem;
                font-size: 0.85rem;
            }
            .welcome-left {
                font-size: 18px;
                margin-right: 12px;
                white-space: normal;
            }
            .search-wrapper {
                flex-wrap: wrap;
            }
        }

        /* 保留原有内联样式中的 transform 定位，但避免覆盖 */
        /* 用户自定义的 transform 保留 */
    </style>
