
<!DOCTYPE html>
<html lang="en" class=""><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
/* ============================================
   HTML Visual Editor v2 — Injected Styles (embedded)
   Design: Claude Design System
   ============================================ */

[data-hve-hovered] {
  outline: 2px dashed #cc785c !important;
  outline-offset: 2px !important;
  cursor: pointer !important;
}

td[data-hve-hovered],
th[data-hve-hovered],
tr[data-hve-hovered] {
  outline-offset: -2px !important;
}

[data-hve-selected] {
  outline: 2px solid #cc785c !important;
  outline-offset: 2px !important;
  cursor: default;
  touch-action: none;
}

[data-hve-dragging] {
  touch-action: none;
}

[data-hve-handle] {
  touch-action: none;
}

[data-hve-selected]:not(td):not(th):not(tr):not(thead):not(tbody):not(tfoot):not(table) {
  position: relative;
}


td[data-hve-selected],
th[data-hve-selected],
tr[data-hve-selected] {
  outline-offset: -2px !important;
}

table[data-hve-selected] {
  outline-offset: 2px !important;
  position: relative;
}

[data-hve-dragging] {
  opacity: 0.85 !important;
  outline: 2px dashed #a9583e !important;
  cursor: grabbing !important;
  box-shadow: 0 8px 32px rgba(20,20,19,0.2), 0 2px 8px rgba(204,120,92,0.15) !important;
  transition: box-shadow 0.15s ease, opacity 0.15s ease !important;
  z-index: 10000 !important;
}

[data-hve-editing] {
  outline: 2px solid #a9583e !important;
  outline-offset: 2px !important;
  cursor: text !important;
  min-height: 1em;
}

td[data-hve-editing],
th[data-hve-editing] {
  outline-offset: -2px !important;
}

/* Firefox scrollbar styling */
[data-hve-editor],
[data-hve-toolbar],
[data-hve-context-menu],
[data-hve-page-sorter],
[data-hve-chart-panel] {
  scrollbar-width: thin;
  scrollbar-color: #8e8b82 transparent;
}

/* ---- Floating Toolbar ---- */
[data-hve-toolbar] {
  position: fixed;
  display: none;
  align-items: center;
  gap: 2px;
  padding: 6px 10px;
  background: #faf9f5;
  border: 1px solid #e6dfd8;
  border-radius: 14px;
  box-shadow: 0 4px 24px rgba(20,20,19,0.12), 0 1px 4px rgba(20,20,19,0.08);
  z-index: 2147483644;
  font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  user-select: none;
  backdrop-filter: blur(8px);
  writing-mode: horizontal-tb;
  direction: ltr;
  text-align: left;
  word-break: normal;
  word-wrap: normal;
  overflow-wrap: normal;
  white-space: nowrap;
  line-height: 1.4;
  text-transform: none;
  letter-spacing: normal;
  text-indent: 0;
  text-decoration: none;
  box-sizing: border-box;
}

[data-hve-toolbar] .hve-tb-group {
  display: flex;
  align-items: center;
  gap: 2px;
}

[data-hve-toolbar] * {
  writing-mode: horizontal-tb;
  direction: ltr;
  word-break: normal;
  box-sizing: border-box;
}

[data-hve-toolbar] .hve-tb-sep {
  width: 1px;
  height: 22px;
  background: #e6dfd8;
  margin: 0 4px;
}

[data-hve-toolbar] button {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 30px;
  height: 30px;
  border: none;
  border-radius: 8px;
  background: transparent;
  cursor: pointer;
  font-size: 13px;
  color: #3d3d3a;
  transition: all 0.15s ease;
  padding: 0;
  position: relative;
  white-space: nowrap;
  overflow: hidden;
}

[data-hve-toolbar] button:hover {
  background: #f5f0e8;
  color: #141413;
}

[data-hve-toolbar] button:active {
  background: #e6dfd8;
  transform: scale(0.93);
}

[data-hve-toolbar] button.hve-active {
  background: #cc785c;
  color: white;
}

[data-hve-toolbar] button.hve-active:hover {
  background: #a9583e;
}

[data-hve-toolbar] .hve-tb-label {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.3px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 64px;
  display: inline-block;
  vertical-align: middle;
}

/* ---- Dropdown ---- */
[data-hve-dropdown] {
  position: fixed;
  background: #faf9f5;
  border: 1px solid #e6dfd8;
  border-radius: 12px;
  box-shadow: 0 8px 32px rgba(20,20,19,0.15);
  padding: 6px;
  z-index: 2147483645;
  min-width: 140px;
  max-height: 320px;
  overflow-y: auto;
  animation: hve-dropdown-in 0.15s ease;
  white-space: normal;
}

[data-hve-dropdown] .hve-dd-item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 12px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 13px;
  color: #3d3d3a;
  transition: background 0.12s;
  white-space: nowrap;
}

[data-hve-dropdown] .hve-dd-item:hover {
  background: #f5f0e8;
  color: #141413;
}

[data-hve-dropdown] .hve-dd-item .hve-dd-icon {
  font-size: 15px;
  width: 20px;
  text-align: center;
}

[data-hve-dropdown] .hve-dd-divider {
  height: 1px;
  background: #e6dfd8;
  margin: 4px 0;
}

@keyframes hve-dropdown-in {
  from { opacity: 0; transform: translateX(-50%) translateY(-4px); }
  to { opacity: 1; transform: translateX(-50%) translateY(0); }
}

/* ---- Insert Indicator ---- */
[data-hve-insert-indicator] {
  position: absolute;
  left: 0;
  right: 0;
  height: 3px;
  background: #cc785c;
  border-radius: 2px;
  pointer-events: none;
  z-index: 2147483640;
  animation: hve-indicator-pulse 1.5s ease infinite;
}

@keyframes hve-indicator-pulse {
  0%, 100% { opacity: 0.6; }
  50% { opacity: 1; }
}

/* ---- Insert Panel ---- */
[data-hve-insert-panel] {
  position: fixed;
  z-index: 2147483646;
  background: #faf9f5;
  border: 1px solid #e6dfd8;
  border-radius: 16px;
  box-shadow: 0 8px 40px rgba(20,20,19,0.18), 0 2px 8px rgba(20,20,19,0.08);
  padding: 8px;
  min-width: 200px;
  font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  animation: hve-panel-in 0.2s cubic-bezier(0.4, 0, 0.2, 1);
}

[data-hve-insert-panel] .hve-ip-title {
  font-size: 11px;
  font-weight: 600;
  color: #8e8b82;
  text-transform: uppercase;
  letter-spacing: 0.8px;
  padding: 8px 12px 6px;
}

[data-hve-insert-panel] .hve-ip-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 12px;
  border-radius: 10px;
  cursor: pointer;
  transition: background 0.12s;
}

[data-hve-insert-panel] .hve-ip-item:hover {
  background: #f5f0e8;
}

[data-hve-insert-panel] .hve-ip-icon {
  width: 32px;
  height: 32px;
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  background: #f5f0e8;
}

[data-hve-insert-panel] .hve-ip-text {
  display: flex;
  flex-direction: column;
}

[data-hve-insert-panel] .hve-ip-text span:first-child {
  font-size: 13px;
  font-weight: 500;
  color: #141413;
}

[data-hve-insert-panel] .hve-ip-text span:last-child {
  font-size: 11px;
  color: #8e8b82;
  margin-top: 1px;
}

@keyframes hve-panel-in {
  from { opacity: 0; transform: scale(0.95); }
  to { opacity: 1; transform: scale(1); }
}

/* ---- Dialog ---- */
[data-hve-dialog-overlay] {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(20,20,19,0.4);
  backdrop-filter: blur(4px);
  z-index: 2147483645;
  animation: hve-fade-in 0.2s ease;
}

[data-hve-dialog] {
  position: fixed;
  top: 50%; left: 50%;
  transform: translate(-50%,-50%);
  z-index: 2147483646;
  background: #faf9f5;
  border: 1px solid #e6dfd8;
  border-radius: 16px;
  box-shadow: 0 16px 48px rgba(20,20,19,0.2);
  padding: 28px;
  min-width: 320px;
  font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  animation: hve-dialog-in 0.25s cubic-bezier(0.4, 0, 0.2, 1);
}

[data-hve-dialog] h3 {
  font-size: 17px;
  font-weight: 600;
  color: #141413;
  margin-bottom: 20px;
}

[data-hve-dialog] label {
  display: block;
  font-size: 12px;
  font-weight: 500;
  color: #6c6a64;
  margin-bottom: 6px;
}

[data-hve-dialog] input[type="number"],
[data-hve-dialog] input[type="text"],
[data-hve-dialog] select {
  width: 100%;
  padding: 10px 12px;
  border: 1px solid #e6dfd8;
  border-radius: 10px;
  font-size: 14px;
  font-family: inherit;
  background: #faf9f5;
  color: #141413;
  transition: border-color 0.2s;
}

[data-hve-dialog] input:focus,
[data-hve-dialog] select:focus {
  outline: none;
  border-color: #cc785c;
  box-shadow: 0 0 0 3px rgba(204,120,92,0.12);
}

[data-hve-dialog] .hve-dialog-actions {
  display: flex;
  gap: 8px;
  justify-content: flex-end;
  margin-top: 24px;
}

[data-hve-dialog] .hve-btn-cancel {
  padding: 9px 18px;
  border: 1px solid #e6dfd8;
  border-radius: 10px;
  background: #faf9f5;
  cursor: pointer;
  font-size: 13px;
  font-weight: 500;
  color: #3d3d3a;
  font-family: inherit;
  transition: all 0.15s;
}

[data-hve-dialog] .hve-btn-cancel:hover {
  background: #f5f0e8;
}

[data-hve-dialog] .hve-btn-confirm {
  padding: 9px 18px;
  border: none;
  border-radius: 10px;
  background: linear-gradient(135deg, #cc785c, #a9583e);
  color: white;
  cursor: pointer;
  font-size: 13px;
  font-weight: 600;
  font-family: inherit;
  box-shadow: 0 2px 8px rgba(204,120,92,0.3);
  transition: all 0.15s;
}

[data-hve-dialog] .hve-btn-confirm:hover {
  background: #a9583e;
  box-shadow: 0 4px 12px rgba(204,120,92,0.4);
}

@keyframes hve-dialog-in {
  from { opacity: 0; transform: translate(-50%,-50%) scale(0.95); }
  to { opacity: 1; transform: translate(-50%,-50%) scale(1); }
}

@keyframes hve-fade-in {
  from { opacity: 0; }
  to { opacity: 1; }
}

/* ---- Toast ---- */
@keyframes hve-toast-in {
  from { opacity: 0; transform: translateX(-50%) translateY(-10px); }
  to { opacity: 1; transform: translateX(-50%) translateY(0); }
}

/* ---- Resize Handles ---- */
[data-hve-resize-container] {
  pointer-events: none;
}

[data-hve-handle] {
  pointer-events: all;
  transition: background 0.15s, transform 0.15s;
}

[data-hve-handle]:hover {
  background: #a9583e !important;
  transform: scale(1.3);
}

/* ---- Context Menu ---- */
[data-hve-context-menu] {
  position: fixed;
  z-index: 2147483647;
  background: #faf9f5;
  border: 1px solid #e6dfd8;
  border-radius: 12px;
  box-shadow: 0 8px 32px rgba(20,20,19,0.15);
  padding: 6px;
  min-width: 180px;
  font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  animation: hve-dropdown-in 0.15s ease;
}

[data-hve-context-menu] .hve-cm-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 12px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 13px;
  color: #3d3d3a;
  transition: background 0.12s;
}

[data-hve-context-menu] .hve-cm-item:hover {
  background: #f5f0e8;
  color: #141413;
}

[data-hve-context-menu] .hve-cm-item.danger {
  color: #EF4444;
}

[data-hve-context-menu] .hve-cm-item.danger:hover {
  background: #FEF2F2;
}

[data-hve-context-menu] .hve-cm-divider {
  height: 1px;
  background: #e6dfd8;
  margin: 4px 0;
}

[data-hve-context-menu] .hve-cm-icon {
  width: 18px;
  text-align: center;
  font-size: 14px;
}

[data-hve-context-menu] .hve-cm-shortcut {
  margin-left: auto;
  font-size: 11px;
  color: #e6dfd8;
  font-family: 'SF Mono', monospace;
}

/* ---- Status Indicator ---- */
[data-hve-status] {
  position: fixed;
  bottom: 20px;
  right: 20px;
  z-index: 2147483647;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 18px;
  background: linear-gradient(135deg, #cc785c, #a9583e);
  color: white;
  border-radius: 24px;
  font: 13px/1.4 "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  font-weight: 500;
  box-shadow: 0 4px 16px rgba(204,120,92,0.35);
  cursor: pointer;
  user-select: none;
  transition: all 0.2s;
}

[data-hve-status]:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 20px rgba(204,120,92,0.45);
}

[data-hve-status] .hve-status-dot {
  width: 8px;
  height: 8px;
  background: #10B981;
  border-radius: 50%;
  animation: hve-pulse 2s ease infinite;
}

@keyframes hve-pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.5; }
}

/* ---- Quick Add Button ---- */
[data-hve-quick-add] {
  user-select: none;
  -webkit-user-select: none;
}

/* ---- Multi-select ---- */
[data-hve-multi-selected] {
  outline: 2px solid #cc785c !important;
  outline-offset: 2px !important;
  cursor: move !important;
  box-shadow: 0 0 0 4px rgba(204, 120, 92, 0.12) !important;
}

[data-hve-marquee-preview] {
  outline: 2px dashed #cc785c !important;
  outline-offset: 1px !important;
  box-shadow: 0 0 0 3px rgba(204, 120, 92, 0.1) !important;
}

[data-hve-marquee] {
  transition: none !important;
}

[data-hve-multi-toast] {
  position: fixed;
  bottom: 64px;
  right: 20px;
  z-index: 2147483647;
  display: flex;
  flex-direction: column;
  gap: 6px;
  padding: 12px 14px;
  background: #faf9f5;
  border: 1px solid #e6dfd8;
  border-radius: 14px;
  font: 13px/1.4 "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  color: #3d3d3a;
  box-shadow: 0 4px 16px rgba(20, 20, 19, 0.12);
  user-select: none;
  animation: hve-panel-in 0.2s cubic-bezier(0.4, 0, 0.2, 1);
}

[data-hve-multi-toast] .hve-multi-info-row {
  display: flex;
  align-items: center;
  gap: 8px;
}

[data-hve-multi-toast] .hve-multi-dot {
  width: 8px;
  height: 8px;
  background: #cc785c;
  border-radius: 50%;
  flex-shrink: 0;
}

[data-hve-multi-toast] b {
  color: #cc785c;
  font-weight: 700;
}

[data-hve-multi-toast] .hve-multi-actions {
  display: flex;
  align-items: center;
  gap: 3px;
  padding: 4px 0;
}

[data-hve-multi-toast] .hve-multi-actions button {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 28px;
  height: 28px;
  border: none;
  border-radius: 7px;
  background: transparent;
  cursor: pointer;
  font-size: 12px;
  color: #3d3d3a;
  transition: all 0.12s ease;
  padding: 0;
}

[data-hve-multi-toast] .hve-multi-actions button:hover {
  background: #f5f0e8;
  color: #141413;
}

[data-hve-multi-toast] .hve-multi-actions button:active {
  background: #e6dfd8;
  transform: scale(0.92);
}

[data-hve-multi-toast] .hve-multi-actions .hve-multi-btn-danger:hover {
  background: #FEF2F2;
  color: #EF4444;
}

[data-hve-multi-toast] .hve-multi-sep {
  width: 1px;
  height: 18px;
  background: #e6dfd8;
  margin: 0 3px;
  flex-shrink: 0;
}

[data-hve-multi-toast] .hve-multi-hint {
  color: #e6dfd8;
  font-size: 11px;
}

/* ---- Locked Elements ---- */
[data-hve-locked] {
  cursor: not-allowed !important;
  position: relative;
}

[data-hve-group][data-hve-selected] {
  outline-style: dashed !important;
  outline-color: #5db8a6 !important;
}

[data-hve-group][data-hve-selected]::before {
  content: 'Group' !important;
  background: #5db8a6 !important;
}

[data-hve-locked]::after {
  content: '🔒';
  position: absolute;
  top: 2px;
  right: 2px;
  font-size: 12px;
  z-index: 100;
  pointer-events: none;
  opacity: 0.7;
}

[data-hve-locked][data-hve-selected] {
  outline-color: #8e8b82 !important;
}

[data-hve-context-menu] .hve-cm-item.disabled {
  opacity: 0.4;
  pointer-events: none;
  cursor: default;
}

/* ---- Page Sorter ---- */
[data-hve-page-sorter] {
  position: fixed;
  top: 60px;
  right: 20px;
  z-index: 2147483646;
  background: #faf9f5;
  border: 1px solid #e6dfd8;
  border-radius: 16px;
  box-shadow: 0 8px 40px rgba(20,20,19,0.18), 0 2px 8px rgba(20,20,19,0.08);
  width: 340px;
  max-height: 80vh;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  animation: hve-panel-in 0.25s cubic-bezier(0.4, 0, 0.2, 1);
}

[data-hve-page-sorter] .hve-ps-header {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 14px 16px;
  border-bottom: 1px solid #e6dfd8;
  background: #f5f0e8;
  border-radius: 16px 16px 0 0;
  flex-shrink: 0;
}

[data-hve-page-sorter] .hve-ps-title {
  font-size: 14px;
  font-weight: 600;
  color: #141413;
}

[data-hve-page-sorter] .hve-ps-count {
  font-size: 11px;
  color: #cc785c;
  background: #efe9de;
  padding: 2px 8px;
  border-radius: 10px;

}

[data-hve-page-sorter] .hve-ps-close {
  margin-left: auto;
  width: 24px;
  height: 24px;
  border: none;
  background: transparent;
  border-radius: 6px;
  cursor: pointer;
  font-size: 14px;
  color: #8e8b82;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.15s;
}

[data-hve-page-sorter] .hve-ps-close:hover {
  background: #f5f0e8;
  color: #141413;
}

[data-hve-page-sorter] .hve-ps-list {
  overflow-y: auto;
  padding: 8px;
  flex: 1;
}

[data-hve-page-sorter] .hve-ps-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px;
  border-radius: 10px;
  cursor: pointer;
  transition: all 0.15s;
  border: 2px solid transparent;
  margin-bottom: 4px;
}

[data-hve-page-sorter] .hve-ps-item:hover {
  background: #f5f0e8;
}

[data-hve-page-sorter] .hve-ps-item.active {
  border-color: #cc785c;
  background: #efe9de;
}

[data-hve-page-sorter] .hve-ps-item.dragging {
  opacity: 0.5;
  transform: scale(0.95);
}

[data-hve-page-sorter] .hve-ps-item.drag-over {
  border-color: #cc785c;
  background: #efe9de;
}

[data-hve-page-sorter] .hve-ps-thumb {
  flex-shrink: 0;
}

[data-hve-page-sorter] .hve-ps-right {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 4px;
}

[data-hve-page-sorter] .hve-ps-info {
  display: flex;
  align-items: center;
  gap: 6px;
}

[data-hve-page-sorter] .hve-ps-num {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 22px;
  height: 22px;
  border-radius: 6px;
  background: #cc785c;
  color: white;
  font-size: 11px;
  font-weight: 700;
  flex-shrink: 0;
}

[data-hve-page-sorter] .hve-ps-name {
  font-size: 12px;
  font-weight: 500;
  color: #141413;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
