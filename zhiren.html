<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智人搜索</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }
        .search-wrapper {
            width: 100%;
            max-width: 600px;
            padding: 20px;
        }
        .search-box {
            background: white;
            border-radius: 24px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            display: flex;
            align-items: center;
            padding: 12px 20px;
            transition: all 0.3s ease;
            border: 1px solid transparent;
        }
        .search-box:focus-within {
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            transform: translateY(-2px);
            border-color: #e2e8f0;
        }
        .search-input {
            flex-grow: 1;
            border: none;
            outline: none;
            font-size: 16px;
            color: #334155;
            background: transparent;
            margin: 0 10px;
        }
        .search-input::placeholder {
            color: #94a3b8;
        }
        .search-icon {
            color: #94a3b8;
        }
        .search-btn {
            background: #3b82f6;
            color: white;
            border: none;
            border-radius: 20px;
            padding: 8px 16px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
        }
        .search-btn:hover {
            background: #2563eb;
        }
    </style>
</head>
<body>

    <div class="search-wrapper">
        <form id="searchForm" onsubmit="handleSearch(event)" class="search-box">
            <svg class="search-icon w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
            <input type="text" id="searchInput" class="search-input" placeholder="智人搜索..." autocomplete="off" autofocus>
            <button type="submit" class="search-btn">搜索</button>
        </form>
    </div>

    <script>
        function handleSearch(event) {
            event.preventDefault();
            const query = document.getElementById('searchInput').value.trim();
            if (query) {
                // 使用百度搜索作为底层引擎
                window.location.href = `https://www.baidu.com/s?wd=${encodeURIComponent(query)}`;
            }
        }
    </script>
</body>
</html>
