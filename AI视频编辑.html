
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClipMaster - 在线视频编辑器</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #0f172a;
            color: #e2e8f0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow-x: hidden;
        }
        
        /* 自定义滚动条 */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #1e293b; 
        }
        ::-webkit-scrollbar-thumb {
            background: #475569; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #64748b; 
        }

        .glass-panel {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
        }

        .range-slider {
            -webkit-appearance: none;
            width: 100%;
            height: 6px;
            border-radius: 5px;
            background: #334155;
            outline: none;
        }
        .range-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #38bdf8;
            cursor: pointer;
            transition: background .15s ease-in-out;
        }
        .range-slider::-webkit-slider-thumb:hover {
            background: #0ea5e9;
        }

        /* 视频容器保持比例 */
        .video-container {
            position: relative;
            width: 100%;
            padding-top: 56.25%; /* 16:9 Aspect Ratio */
            background: #000;
            border-radius: 0.5rem;
            overflow: hidden;
        }
        .video-element, .canvas-element {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        .canvas-element {
            z-index: 10;
            display: none; /* 默认隐藏，录制时显示或用于后台绘制 */
        }
        
        .loader {
            border: 3px solid #f3f3f3;
            border-radius: 50%;
            border-top: 3px solid #38bdf8;
            width: 20px;
            height: 20px;
            -webkit-animation: spin 1s linear infinite; /* Safari */
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- 顶部导航 -->
    <header class="glass-panel sticky top-0 z-50 px-6 py-4 flex justify-between items-center border-b border-slate-700">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 bg-gradient-to-br from-cyan-500 to-blue-600 rounded-lg flex items-center justify-center shadow-lg">
                <i class="fa-solid fa-film text-white text-xl"></i>
            </div>
            <h1 class="text-xl font-bold tracking-wide text-white">ClipMaster <span class="text-xs font-normal text-slate-400 ml-2">Web Editor</span></h1>
        </div>
        <div class="flex gap-4">
            <button onclick="document.getElementById('fileInput').click()" class="px-4 py-2 bg-slate-700 hover:bg-slate-600 rounded-lg text-sm font-medium transition-colors flex items-center gap-2">
                <i class="fa-solid fa-upload"></i> 导入视频
            </button>
            <input type="file" id="fileInput" accept="video/*" class="hidden" onchange="handleFileSelect(event)">
            
            <button id="exportBtn" onclick="startExport()" disabled class="px-4 py-2 bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 rounded-lg text-sm font-bold text-white shadow-lg transition-all disabled:opacity-50 disabled:cursor-not-allowed flex items-center gap-2">
                <i class="fa-solid fa-download"> 导出视频
            </button>
        </div>
    </header>

    <!-- 主工作区 -->
    <main class="flex-grow flex flex-col lg:flex-row p-6 gap-6 max-w-7xl mx-auto w-full">
        
        <!-- 左侧：预览区域 -->
        <section class="flex-grow lg:w-2/3 flex flex-col gap-4">
            <div class="glass-panel p-1 rounded-xl relative group">
                <div class="video-container bg-black rounded-lg" id="previewContainer">
                    <video id="mainVideo" class="video-element" controls crossorigin="anonymous" playsinline>
                        您的浏览器不支持 HTML5 视频。
                    </video>
                    <canvas id="processingCanvas" class="canvas-element"></canvas>
                    
                    <!-- 空状态提示 -->
                    <div id="emptyState" class="absolute inset-0 flex flex-col items-center justify-center text-slate-500 bg-slate-900/80 z-20">
                        <i class="fa-solid fa-cloud-arrow-up text-4xl mb-3"></i>
                        <p>请导入视频开始编辑</p>
                    </div>
                </div>
            </div>

            <!-- 时间轴/进度控制 (简化版) -->
            <div class="glass-panel p-4 rounded-xl flex items-center gap-4">
                <button id="playPauseBtn" onclick="togglePlay()" class="w-10 h-10 rounded-full bg-slate-700 hover:bg-slate-600 flex items-center justify-center transition-colors">
                    <i class="fa-solid fa-play text-white" id="playIcon"></i>
                </button>
                <div class="flex-grow">
                    <div class="flex justify-between text-xs text-slate-400 mb-1">
                        <span id="currentTime">00:00</span>
                        <span id="duration">00:00</span>
                    </div>
                    <input type="range" id="seekBar" value="0" min="0" step="0.1" class="range-slider" oninput="seekVideo(this.value)">
                </div>
            </div>
        </section>

        <!-- 右侧：控制面板 -->
        <aside class="lg:w-1/3 flex flex-col gap-6">
            
            <!-- 基础调整 -->
            <div class="glass-panel p-5 rounded-xl space-y-5">
                <h3 class="text-sm font-bold text-slate-300 uppercase tracking-wider border-b border-slate-700 pb-2">画面调整</h3>
                
                <!-- 亮度 -->
                <div class="space-y-2">
                    <div class="flex justify-between text-xs">
                        <span class="text-slate-400"><i class="fa-regular fa-sun mr-1"></i> 亮度</span>
                        <span id="val-brightness" class="text-cyan-400">100%</span>
                    </div>
                    <input type="range" min="0" max="200" value="100" class="range-slider" oninput="updateFilter('brightness', this.value)">
                </div>

                <!-- 对比度 -->
                <div class="space-y-2">
                    <div class="flex justify-between text-xs">
                        <span class="text-slate-400"><i class="fa-solid fa-circle-half-stroke mr-1"></i> 对比度</span>
                        <span id="val-contrast" class="text-cyan-400">100%</span>
                    </div>
                    <input type="range" min="0" max="200" value="100" class="range-slider" oninput="updateFilter('contrast', this.value)">
                </div>

                <!-- 饱和度 -->
                <div class="space-y-2">
                    <div class="flex justify-between text-xs">
                        <span class="text-slate-400"><i class="fa-solid fa-droplet mr-1"></i> 饱和度</span>
                        <span id="val-saturate" class="text-cyan-400">100%</span>
                    </div>
                    <input type="range" min="0" max="200" value="100" class="range-slider" oninput="updateFilter('saturate', this.value)">
                </div>

                <!-- 模糊 -->
                <div class="space-y-2">
                    <div class="flex justify-between text-xs">
                        <span class="text-slate-400"><i class="fa-solid fa-eye-slash mr-1"></i> 模糊</span>
                        <span id="val-blur" class="text-cyan-400">0px</span>
                    </div>
                    <input type="range" min="0" max="20" value="0" step="0.5" class="range-slider" oninput="updateFilter('blur', this.value)">
                </div>
                
                <button onclick="resetFilters()" class="w-full py-2 text-xs text-slate-400 hover:text-white border border-slate-700 rounded hover:bg-slate-700 transition-colors">
                    重置画面效果
                </button>
            </div>

            <!-- 播放控制 -->
            <div class="glass-panel p-5 rounded-xl space-y-5">
                <h3 class="text-sm font-bold text-slate-300 uppercase tracking-wider border-b border-slate-700 pb-2">播放设置</h3>
                
                <!-- 速度 -->
                <div class="space-y-2">
                    <div class="flex justify-between text-xs">
                        <span class="text-slate-400"><i class="fa-solid fa-gauge-high mr-1"></i> 播放速度</span>
                        <span id="val-speed" class="text-cyan-400">1.0x</span>
                    </div>
                    <input type="range" min="0.5" max="4" step="0.5" value="1" class="range-slider" oninput="updateSpeed(this.value)">
                </div>

                <!-- 音量 -->
                <div class="space-y-2">
                    <div class="flex justify-between text-xs">
                        <span class="text-slate-400"><i class="fa-solid fa-volume-high mr-1"></i> 音量</span>
                        <span id="val-volume" class="text-cyan-400">100%</span>
                    </div>
                    <input type="range" min="0" max="1" step="0.1" value="1" class="range-slider" oninput="updateVolume(this.value)">
                </div>
            </div>

            <!-- 裁剪信息 (仅展示，简单实现) -->
            <div class="glass-panel p-5 rounded-xl">
                <h3 class="text-sm font-bold text-slate-300 uppercase tracking-wider border-b border-slate-700 pb-2 mb-3">视频信息</h3>
                <div class="grid grid-cols-2 gap-4 text-xs text-slate-400">
                    <div>
                        <span class="block mb-1">分辨率</span>
                        <span id="info-res" class="text-white font-mono">-</span>
                    </div>
                    <div>
                        <span class="block mb-1">时长</span>
                        <span id="info-duration" class="text-white font-mono">-</span>
                    </div>
                    <div>
                        <span class="block mb-1">格式</span>
                        <span id="info-type" class="text-white font-mono">-</span>
                    </div>
                    <div>
                        <span class="block mb-1">大小</span>
                        <span id="info-size" class="text-white font-mono">-</span>
                    </div>
                </div>
            </div>

        </aside>
    </main>

    <!-- 导出进度模态框 -->
    <div id="exportModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-[100] hidden flex items-center justify-center">
        <div class="bg-slate-800 p-8 rounded-2xl shadow-2xl max-w-md w-full text-center border border-slate-700">
            <div class="mb-6">
                <div class="w-16 h-16 bg-blue-500/20 rounded-full flex items-center justify-center mx-auto mb-4">
                    <i class="fa-solid fa-film text-3xl text-blue-400 animate-pulse"></i>
                </div>
                <h3 class="text-xl font-bold text-white mb-2">正在处理视频...</h3>
                <p class="text-slate-400 text-sm">请勿关闭页面，正在实时渲染并录制</p>
            </div>
            
            <div class="w-full bg-slate-700 rounded-full h-2.5 mb-2 overflow-hidden">
                <div id="progressBar" class="bg-blue-500 h-2.5 rounded-full transition-all duration-200" style="width: 0%"></div>
            </div>
            <div class="flex justify-between text-xs text-slate-400 font-mono">
                <span id="progressText">0%</span>
                <span id="timeRemaining">计算中...</span>
            </div>
            
            <button onclick="cancelExport()" class="mt-6 text-sm text-slate-500 hover:text-red-400 transition-colors">取消导出</button>
        </div>
    </div>

    <script>
        // 全局变量
        const video = document.getElementById('mainVideo');
        const canvas = document.getElementById('processingCanvas');
        const ctx = canvas.getContext('2d');
        const fileInput = document.getElementById('fileInput');
        const emptyState = document.getElementById('emptyState');
        const exportBtn = document.getElementById('exportBtn');
        
        let mediaRecorder;
        let recordedChunks = [];
        let isExporting = false;
        let animationId;
        
        // 滤镜状态
        const filters = {
            brightness: 100,
            contrast: 100,
            saturate: 100,
            blur: 0,
            hueRotate: 0
        };

        // 1. 文件处理
        function handleFileSelect(event) {
            const file = event.target.files;
            if (!file) return;

            const url = URL.createObjectURL(file);
            video.src = url;
            
            video.onloadedmetadata = () => {
                emptyState.classList.add('hidden');
                exportBtn.disabled = false;
                
                // 更新信息面板
                document.getElementById('info-res').textContent = `${video.videoWidth} x ${video.videoHeight}`;
                document.getElementById('info-duration').textContent = formatTime(video.duration);
                document.getElementById('info-type').textContent = file.type.split('/').toUpperCase();
                document.getElementById('info-size').textContent = (file.size / (1024 * 1024)).toFixed(2) + ' MB';
                
                // 初始化 Canvas 尺寸
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                
                updateSeekBar();
            };
        }

        // 2. 播放控制
        function togglePlay() {
            if (video.paused) {
                video.play();
                document.getElementById('playIcon').classList.remove('fa-play');
                document.getElementById('playIcon').classList.add('fa-pause');
                renderLoop(); // 启动渲染循环以支持滤镜预览
            } else {
                video.pause();
                document.getElementById('playIcon').classList.remove('fa-pause');
                document.getElementById('playIcon').classList.add('fa-play');
                cancelAnimationFrame(animationId);
            }
        }

        function seekVideo(value) {
            video.currentTime = value;
        }

        function updateSeekBar() {
            const seekBar = document.getElementById('seekBar');
            const currentTimeEl = document.getElementById('currentTime');
            
            video.addEventListener('timeupdate', () => {
                seekBar.max = video.duration;
                seekBar.value = video.currentTime;
                currentTimeEl.textContent = formatTime(video.currentTime);
            });
            
            video.addEventListener('loadedmetadata', () => {
                document.getElementById('duration').textContent = formatTime(video.duration);
                seekBar.max = video.duration;
            });
        }

        // 3. 滤镜与效果
        function updateFilter(type, value) {
            filters[type] = value;
            applyFilters();
            
            // 更新UI数值显示
            const suffix = type === 'blur' ? 'px' : '%';
            document.getElementById(`val-${type}`).textContent = value + suffix;
        }

        function applyFilters() {
            const filterString = `
                brightness(${filters.brightness}%) 
                contrast(${filters.contrast}%) 
                saturate(${filters.saturate}%) 
                blur(${filters.blur}px)
            `;
            video.style.filter = filterString;
        }

        function resetFilters() {
            filters.brightness = 100;
            filters.contrast = 100;
            filters.saturate = 100;
            filters.blur = 0;
            
            // 重置输入框
            document.querySelectorAll('input[type="range"]').forEach(input => {
                if(input.parentElement.querySelector('span')?.textContent.includes('亮度')) input.value = 100;
                if(input.parentElement.querySelector('span')?.textContent.includes('对比度')) input.value = 100;
                if(input.parentElement.querySelector('span')?.textContent.includes('饱和度')) input.value = 100;
                if(input.parentElement.querySelector('span')?.textContent.includes('模糊')) input.value = 0;
            });
            
            applyFilters();
            
            // 重置UI文本
            document.getElementById('val-brightness').textContent = '100%';
            document.getElementById('val-contrast').textContent = '100%';
            document.getElementById('val-saturate').textContent = '100%';
            document.getElementById('val-blur').textContent = '0px';
        }

        function updateSpeed(value) {
            video.playbackRate = value;
            document.getElementById('val-speed').textContent = value + 'x';
        }

        function updateVolume(value) {
            video.volume = value;
            document.getElementById('val-volume').textContent = Math.round(value * 100) + '%';
        }

        // 4. 核心渲染循环 (用于预览和导出)
        function renderLoop() {
            if (video.paused || video.ended) return;
            
            // 将视频帧绘制到 Canvas
            ctx.filter = `
                brightness(${filters.brightness}%) 
                contrast(${filters.contrast}%) 
                saturate(${filters.saturate}%) 
                blur(${filters.blur}px)
            `;
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            
            animationId = requestAnimationFrame(renderLoop);
        }

        // 5. 导出逻辑 (使用 MediaRecorder 录制 Canvas)
        async function startExport() {
            if (isExporting) return;
            isExporting = true;
            
            const modal = document.getElementById('exportModal');
            const progressBar = document.getElementById('progressBar');
            const progressText = document.getElementById('progressText');
            
            modal.classList.remove('hidden');
            
            // 准备录制
            const stream = canvas.captureStream(30); // 30 FPS
            
            // 尝试添加音频轨道 (如果浏览器支持且视频有音轨)
            if (video.captureStream) {
                 try {
                    const videoStream = video.captureStream();
                    const audioTracks = videoStream.getAudioTracks();
                    if (audioTracks.length > 0) {
                        stream.addTrack(audioTracks);
                    }
                 } catch(e) {
                     console.warn("音频捕获失败，将导出无声视频", e);
                 }
            } else if (video.mozCaptureStream) {
                 // Firefox 兼容
                 const videoStream = video.mozCaptureStream();
                 const audioTracks = videoStream.getAudioTracks();
                 if (audioTracks.length > 0) stream.addTrack(audioTracks[0]);
            }

            const mimeType = MediaRecorder.isTypeSupported('video/webm; codecs=vp9') 
                ? 'video/webm; codecs=vp9' 
                : 'video/webm';
                
            mediaRecorder = new MediaRecorder(stream, { mimeType });
            recordedChunks = [];

            mediaRecorder.ondataavailable = (e) => {
                if (e.data.size > 0) recordedChunks.push(e.data);
            };

            mediaRecorder.onstop = () => {
                const blob = new Blob(recordedChunks, { type: 'video/webm' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.style.display = 'none';
                a.href = url;
                a.download = `edited_video_${Date.now()}.webm`;
                document.body.appendChild(a);
                a.click();
                window.URL.revokeObjectURL(url);
                
                // 重置状态
                isExporting = false;
                modal.classList.add('hidden');
                video.currentTime = 0; // 重置视频位置
                alert('视频导出成功！');
            };

            // 开始录制流程
            video.currentTime = 0;
            video.play();
            mediaRecorder.start();
            renderLoop(); // 确保 Canvas 在绘制

            // 监控进度
            const duration = video.duration;
            const updateProgress = setInterval(() => {
                if (!isExporting) {
                    clearInterval(updateProgress);
                    return;
                }
                const current = video.currentTime;
                const percent = Math.min((current / duration) * 100, 100);
                
                progressBar.style.width = `${percent}%`;
                progressText.textContent = `${Math.round(percent)}%`;
                
                if (current >= duration - 0.1) {
                    clearInterval(updateProgress);
                    mediaRecorder.stop();
                    video.pause();
                }
            }, 100);
        }

        function cancelExport() {
            if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                mediaRecorder.stop();
            }
            video.pause();
            isExporting = false;
            document.getElementById('exportModal').classList.add('hidden');
        }

        // 工具函数
        function formatTime(seconds) {
            if (isNaN(seconds)) return "00:00";
            const m = Math.floor(seconds / 60);
            const s = Math.floor(seconds % 60);
            return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
        }
    </script>
</body>
</html>
