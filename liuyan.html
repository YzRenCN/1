<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的留言板 | Guestbook</title>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* 自定义动画 */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .message-card {
            animation: fadeIn 0.5s ease-out forwards;
        }
        /* 滚动条美化 */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1; 
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8; 
        }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-100 to-slate-200 min-h-screen font-sans text-slate-800">

    <!-- 顶部导航 -->
    <nav class="bg-white/80 backdrop-blur-md shadow-sm sticky top-0 z-50">
        <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <div class="flex items-center gap-2">
                    <i class="fa-solid fa-book-open text-indigo-600 text-xl"></i>
                    <span class="font-bold text-xl tracking-tight text-slate-700">GuestBook</span>
                </div>
                <div class="text-sm text-slate-500">
                    <i class="fa-solid fa-server mr-1"></i> Static Mode
                </div>
            </div>
        </div>
    </nav>

    <!-- 主要内容区 -->
    <main class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-10">
        
        <!-- 欢迎标语 -->
        <div class="text-center mb-10">
            <h1 class="text-3xl md:text-4xl font-extrabold text-slate-800 mb-2">留下您的足迹</h1>
            <p class="text-slate-500">在 GitHub Pages 上运行的纯前端留言板</p>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
            
            <!-- 左侧：留言表单 -->
            <div class="md:col-span-1">
                <div class="bg-white rounded-2xl shadow-lg p-6 sticky top-24 border border-slate-100">
                    <h2 class="text-lg font-semibold mb-4 flex items-center gap-2">
                        <i class="fa-solid fa-pen-to-square text-indigo-500"></i> 写留言
                    </h2>
                    <form id="guestForm" class="space-y-4">
                        <div>
                            <label for="username" class="block text-sm font-medium text-slate-700 mb-1">昵称</label>
                            <div class="relative">
                                <span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                    <i class="fa-regular fa-user text-slate-400"></i>
                                </span>
                                <input type="text" id="username" required maxlength="20"
                                    class="pl-10 block w-full rounded-lg border-slate-300 bg-slate-50 border focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm py-2 transition-colors"
                                    placeholder="怎么称呼您？">
                            </div>
                        </div>

                        <div>
                            <label for="content" class="block text-sm font-medium text-slate-700 mb-1">内容</label>
                            <textarea id="content" required maxlength="200" rows="4"
                                class="block w-full rounded-lg border-slate-300 bg-slate-50 border focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm p-3 transition-colors resize-none"
                                placeholder="说点什么吧..."></textarea>
                            <div class="text-right text-xs text-slate-400 mt-1">
                                <span id="charCount">0</span>/200
                            </div>
                        </div>

                        <button type="submit" 
                            class="w-full flex justify-center py-2 px-4 border border-transparent rounded-lg shadow-sm text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition-all transform active:scale-95">
                            <i class="fa-solid fa-paper-plane mr-2 mt-0.5"></i> 提交留言
                        </button>
                    </form>
                    
                    <div class="mt-6 pt-6 border-t border-slate-100">
                        <div class="flex items-center justify-between text-xs text-slate-500">
                            <span><i class="fa-solid fa-database mr-1"></i> 数据存储于本地</span>
                            <button onclick="app.clearAll()" class="text-red-500 hover:text-red-700 underline">清空所有</button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 右侧：留言列表 -->
            <div class="md:col-span-2">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-lg font-semibold flex items-center gap-2">
                        <i class="fa-regular fa-comments text-indigo-500"></i> 最新留言
                        <span id="totalCount" class="bg-indigo-100 text-indigo-800 text-xs font-medium px-2.5 py-0.5 rounded-full">0</span>
                    </h2>
                    <div class="text-sm text-slate-500">
                        仅当前设备可见
                    </div>
                </div>

                <!-- 留言容器 -->
                <div id="messageList" class="space-y-4">
                    <!-- 空状态提示 -->
                    <div id="emptyState" class="text-center py-12 bg-white/50 rounded-2xl border border-dashed border-slate-300">
                        <i class="fa-regular fa-folder-open text-4xl text-slate-300 mb-3"></i>
                        <p class="text-slate-500">还没有留言，快来抢沙发！</p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- 页脚 -->
    <footer class="bg-white border-t border-slate-200 mt-12">
        <div class="max-w-4xl mx-auto px-4 py-6 sm:px-6 lg:px-8 flex justify-between items-center">
            <p class="text-slate-500 text-sm">&copy; 2026 My GitHub Page. All rights reserved.</p>
            <div class="flex space-x-4">
                <a href="#" class="text-slate-400 hover:text-indigo-600"><i class="fa-brands fa-github text-xl"></i></a>
                <a href="#" class="text-slate-400 hover:text-indigo-600"><i class="fa-brands fa-twitter text-xl"></i></a>
            </div>
        </div>
    </footer>

    <!-- Toast 通知容器 -->
    <div id="toastContainer" class="fixed bottom-5 right-5 z-50 flex flex-col gap-2"></div>

    <script src="app.js"></script>
</body>
</html>
